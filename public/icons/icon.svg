<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- sprout leaves -->
  <path d="M256 356 C 256 240, 176 200, 128 200 C 128 296, 200 356, 256 356 Z" fill="url(#leaf)"/>
  <path d="M256 356 C 256 240, 336 200, 384 200 C 384 296, 312 356, 256 356 Z" fill="url(#leaf)" opacity="0.85"/>
  <!-- stem -->
  <rect x="248" y="336" width="16" height="80" rx="8" fill="#fde68a"/>
  <!-- ground line -->
  <rect x="120" y="416" width="272" height="8" rx="4" fill="#fbbf24" opacity="0.8"/>
</svg>
